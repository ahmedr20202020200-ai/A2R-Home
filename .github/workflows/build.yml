                      px[x, y] = fn(x / (n - 1), y / (n - 1))
              return g.resize((S, S), Image.BICUBIC)

          def mix(c1, c2, u):
              u = max(0.0, min(1.0, u))
              return tuple(int(c1[i] + (c2[i] - c1[i]) * u) for i in range(3))

          def bg_dark():
              return grad(lambda x, y: mix((44, 52, 72), (12, 14, 22), math.hypot(x - .5, y - .32) / .95))

          def gold():
              a = math.radians(75); dx, dy = math.cos(a), math.sin(a)
              k = abs(dx) * .5 + abs(dy) * .5
              return grad(lambda x, y: mix(GOLD1, GOLD2, ((x - .5) * dx + (y - .5) * dy) / k * .5 + .5))

          def arc(d, cx, cy, r, a0, a1, w):
              d.arc([cx - r, cy - r, cx + r, cy + r], a0, a1, fill=255, width=w)
              rm = r - w / 2
              for a in (a0, a1):
                  t = math.radians(a); x, y = cx + rm * math.cos(t), cy + rm * math.sin(t)
                  d.ellipse([x - w / 2, y - w / 2, x + w / 2, y + w / 2], fill=255)

          def fg_layer():
              m = Image.new('L', (S, S), 0); d = ImageDraw.Draw(m)
              font = find_font()
              print('font:', font)
              if font:
                  f = ImageFont.truetype(font, int(S * .255))
                  bb = d.textbbox((0, 0), 'A2R', font=f)
                  tw, th = bb[2] - bb[0], bb[3] - bb[1]
                  d.text(((S - tw) / 2 - bb[0], S * .55 - bb[1]), 'A2R', font=f, fill=255)
                  by = S * .55 + th + S * .04
                  d.rounded_rectangle([S * .5 - tw / 2, by, S * .5 + tw / 2, by + S * .03], radius=S * .015, fill=255)
                  ox, oy, sc = S * .5, S * .455, 1.0
              else:
                  ox, oy, sc = S * .5, S * .62, 1.5   # من غير خط: الموجات بس أكبر
              w = int(S * .04 * sc)
              rr = S * .036 * sc
              d.ellipse([ox - rr, oy - rr, ox + rr, oy + rr], fill=255)
              for r in (.095, .16, .225):
                  arc(d, ox, oy, S * r * sc + w / 2, 228, 312, w)
              fg = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              sh = m.filter(ImageFilter.GaussianBlur(45)).point(lambda v: v * 120 // 255)
              tmp = Image.new('L', (S, S), 0); tmp.paste(sh, (0, 35))
              fg.paste(Image.new('RGBA', (S, S), (0, 0, 0, 255)), (0, 0), tmp)
              fg.paste(gold().convert('RGBA'), (0, 0), m)
              global MASK
              MASK = m.copy()
              return fg

          BG = bg_dark()
          FG = fg_layer()
          FULL = BG.convert('RGBA'); FULL.alpha_composite(FG)

          def legacy(px):
              big = px * 4
              img = FULL.resize((big, big), Image.LANCZOS)
              msk = Image.new('L', (big, big), 0)
              ImageDraw.Draw(msk).rounded_rectangle([0, 0, big - 1, big - 1], radius=int(big * .22), fill=255)
              out = Image.new('RGBA', (big, big), (0, 0, 0, 0)); out.paste(img, (0, 0), msk)
              return out.resize((px, px), Image.LANCZOS)

          def round_icon(px):
              big = px * 4
              img = FULL.resize((big, big), Image.LANCZOS)
              msk = Image.new('L', (big, big), 0); ImageDraw.Draw(msk).ellipse([0, 0, big - 1, big - 1], fill=255)
              out = Image.new('RGBA', (big, big), (0, 0, 0, 0)); out.paste(img, (0, 0), msk)
              return out.resize((px, px), Image.LANCZOS)

          def adaptive(px108):
              inner = round(px108 * 72 / 108); off = (px108 - inner) // 2
              fg = Image.new('RGBA', (px108, px108), (0, 0, 0, 0))
              fg.paste(FG.resize((inner, inner), Image.LANCZOS), (off, off))
              bg = BG.resize((inner, inner), Image.LANCZOS).resize((px108, px108), Image.LANCZOS)
              return bg, fg

          res = 'android/app/src/main/res'
          for name, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              d = f'{res}/mipmap-{name}'
              os.makedirs(d, exist_ok=True)
              legacy(px).save(f'{d}/ic_launcher.png')
              round_icon(px).save(f'{d}/ic_launcher_round.png')
              b, f = adaptive(px * 108 // 48)
              b.save(f'{d}/ic_launcher_background.png')
              f.save(f'{d}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@mipmap/ic_launcher_background"/>\n'
                 '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w').write(xml)
          # أيقونة الإشعار (أندرويد بيستخدم الشفافية بس): A2R + الموجات أبيض على شفاف، 24dp
          bb = MASK.getbbox()
          crop = MASK.crop(bb)
          side = max(crop.size)
          sq = Image.new('L', (side, side), 0)
          sq.paste(crop, ((side - crop.size[0]) // 2, (side - crop.size[1]) // 2))
          for name, px in {'mdpi': 24, 'hdpi': 36, 'xhdpi': 48, 'xxhdpi': 72, 'xxxhdpi': 96}.items():
              d = f'{res}/drawable-{name}'
              os.makedirs(d, exist_ok=True)
              inner = px - 2 * max(1, px // 12)   # هامش 2dp تقريبًا
              a = sq.resize((inner, inner), Image.LANCZOS)
              out = Image.new('RGBA', (px, px), (255, 255, 255, 0))
              white = Image.new('RGBA', (inner, inner), (255, 255, 255, 255))
              white.putalpha(a)
              out.paste(white, ((px - inner) // 2, (px - inner) // 2))
              out.save(f'{d}/ic_stat_a2r.png')
          # علشان ضغط الموارد في نسخة release ميشيلهاش (بنوصلها بالاسم من الكوتلن)
          os.makedirs(f'{res}/raw', exist_ok=True)
          open(f'{res}/raw/a2r_keep.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@drawable/ic_stat_a2r"/>\n')
          for r, _, fs in os.walk(res):
              for f in fs:
                  if 'ic_launcher' in f or 'ic_stat' in f: print(os.path.join(r, f))
          PYICON
          # لو أيقونة الإشعار متعملتش: نقولها بصوت عالي (تحذير أحمر في صفحة البناء) بدل ما تعدّي ساكتة
          RES=android/app/src/main/res
          n=$(ls $RES/drawable-*/ic_stat_a2r.png 2>/dev/null | wc -l)
          if [ "$n" -lt 5 ]; then
            echo "::error title=أيقونة الإشعار::ic_stat_a2r.png اتعمل في $n من 5 مقاسات — الإشعارات هتطلع بأيقونة غلط"
            echo "### ⚠️ أيقونة الإشعار (ic_stat_a2r) متعملتش ($n/5) — الإشعارات هتطلع بأيقونة غلط" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ أيقونة التطبيق + أيقونة الإشعار اتعملوا ($n/5 مقاسات)" >> "$GITHUB_STEP_SUMMARY"

      - name: Disable release lint (lint crash in webview plugin)
        run: |
          python3 - <<'PY2'
          import glob
          for f in glob.glob('android/app/build.gradle*'):
              s = open(f, encoding='utf-8').read()
              if f.endswith('.kts'):
                  s += '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n'
              else:
                  s += '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n'
              open(f, 'w', encoding='utf-8').write(s)
              print(f); print(s[-200:])
          PY2

      # v7: توقيع ثابت — كل نسخة بنفس التوقيع، فالتحديث بيتثبت فوق القديم ومن غير «تطبيق جديد مجهول» كل مرة.
      # المفتاح بيتعمل من «جملة سر» واحدة في Secrets باسم A2R_SIGN_SECRET (مفيش ملف مفتاح في الريبو خالص).
      - name: Signing key (ثابت من A2R_SIGN_SECRET)
        env:
          A2R_SIGN_SECRET: ${{ secrets.A2R_SIGN_SECRET }}
        run: |
          if [ ${#A2R_SIGN_SECRET} -lt 12 ]; then
            echo "::warning title=التوقيع::مفيش Secret اسمه A2R_SIGN_SECRET (أو أقصر من 12 حرف) — النسخة دي متوقعة بمفتاح مؤقت وهتتطلب مسح التطبيق القديم"
            echo "### ⚠️ التوقيع: مفتاح مؤقت (ضيف Secret اسمه A2R_SIGN_SECRET علشان التوقيع يثبت)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          KS_DIR="$RUNNER_TEMP/a2rks"
          mkdir -p "$KS_DIR"
          chmod 700 "$KS_DIR"
          cat > "$KS_DIR/a2r_sign.py" <<'PYSIGN'
          #!/usr/bin/env python3
          # A2R Home: deterministic signing key from ONE secret phrase (GitHub secret A2R_SIGN_SECRET).
          # Same phrase -> same RSA key + same certificate on every build -> APK signature never changes.
          # Pure Python (no pip). Writes key.pem + cert.pem; the workflow packs them into a .p12 with openssl.
          import hashlib, hmac, sys, os

          def drbg(seed):
              c = 0
              while True:
                  yield hashlib.sha256(seed + c.to_bytes(8, 'big')).digest()
                  c += 1

          class Rnd:
              def __init__(self, seed):
                  self.g = drbg(seed); self.buf = b''
              def bytes(self, n):
                  while len(self.buf) < n:
                      self.buf += next(self.g)
                  out, self.buf = self.buf[:n], self.buf[n:]
                  return out
              def int_below(self, n):
                  k = (n.bit_length() + 7) // 8 + 8
                  return int.from_bytes(self.bytes(k), 'big') % n

          SMALL = [p for p in range(3, 2000, 2) if all(p % d for d in range(3, int(p ** 0.5) + 1, 2))]

          def is_probable_prime(n, r):
              if n < 2: return False
              for p in SMALL:
                  if n % p == 0: return n == p
              d, s = n - 1, 0
              while d % 2 == 0: d //= 2; s += 1
              for _ in range(48):
                  a = 2 + r.int_below(n - 3)
                  x = pow(a, d, n)
                  if x in (1, n - 1): continue
                  for _ in range(s - 1):
                      x = pow(x, 2, n)
                      if x == n - 1: break
                  else:
                      return False
              return True

          def gen_prime(r, bits, e):
              while True:
                  c = int.from_bytes(r.bytes(bits // 8), 'big') | (3 << (bits - 2)) | 1
                  if (c - 1) % e == 0: continue
                  if is_probable_prime(c, r): return c

          def der_len(n):
              if n < 0x80: return bytes([n])
              b = n.to_bytes((n.bit_length() + 7) // 8, 'big'); return bytes([0x80 | len(b)]) + b
          def tlv(tag, body): return bytes([tag]) + der_len(len(body)) + body
          def dint(v):
              b = v.to_bytes(max(1, (v.bit_length() + 8) // 8), 'big'); return tlv(0x02, b)
          def seq(*xs): return tlv(0x30, b''.join(xs))
          def oid(s):
              p = [int(x) for x in s.split('.')]; out = bytes([40 * p[0] + p[1]])
              for v in p[2:]:
                  enc = [v & 0x7f]; v >>= 7
                  while v: enc.append(0x80 | (v & 0x7f)); v >>= 7
                  out += bytes(reversed(enc))
              return tlv(0x06, out)
          def utf8(s): return tlv(0x0c, s.encode())
          def gtime(s): return tlv(0x18, s.encode())
          def pem(label, der):
              import base64
              b = base64.b64encode(der).decode()
              return f'-----BEGIN {label}-----\n' + '\n'.join(b[i:i + 64] for i in range(0, len(b), 64)) + f'\n-----END {label}-----\n'

          def build(secret):
              seed = hmac.new(secret.encode(), b'a2r-home-apk-signing-v1', hashlib.sha256).digest()
              r = Rnd(seed); e = 65537
              while True:
                  p = gen_prime(r, 1024, e); q = gen_prime(r, 1024, e)
                  if p == q: continue
                  if p < q: p, q = q, p
                  n = p * q
                  if n.bit_length() == 2048: break
              d = pow(e, -1, (p - 1) * (q - 1))
              key = seq(dint(0), dint(n), dint(e), dint(d), dint(p), dint(q), dint(d % (p - 1)), dint(d % (q - 1)), dint(pow(q, -1, p)))
              sha256rsa = seq(oid('1.2.840.113549.1.1.11'), tlv(0x05, b''))
              name = seq(tlv(0x31, seq(oid('2.5.4.3'), utf8('A2R Home'))), tlv(0x31, seq(oid('2.5.4.10'), utf8('A2R'))))
              spki = seq(seq(oid('1.2.840.113549.1.1.1'), tlv(0x05, b'')), tlv(0x03, b'\x00' + seq(dint(n), dint(e))))
              tbs = seq(tlv(0xa0, dint(2)), dint(1), sha256rsa, name,
                        seq(gtime('20260101000000Z'), gtime('20760101000000Z')), name, spki)
              h = hashlib.sha256(tbs).digest()
              di = seq(seq(oid('2.16.840.1.101.3.4.2.1'), tlv(0x05, b'')), tlv(0x04, h))
              k = 256
              em = b'\x00\x01' + b'\xff' * (k - len(di) - 3) + b'\x00' + di
              sig = pow(int.from_bytes(em, 'big'), d, n).to_bytes(k, 'big')
              cert = seq(tbs, sha256rsa, tlv(0x03, b'\x00' + sig))
              return pem('RSA PRIVATE KEY', key), pem('CERTIFICATE', cert), hashlib.sha256(cert).hexdigest()

          if __name__ == '__main__':
              secret = os.environ.get('A2R_SIGN_SECRET', '')
              if len(secret) < 12:
                  print('secret too short'); sys.exit(2)
              out = sys.argv[1] if len(sys.argv) > 1 else '.'
              k, c, fp = build(secret)
              open(os.path.join(out, 'key.pem'), 'w').write(k)
              open(os.path.join(out, 'cert.pem'), 'w').write(c)
              print('cert sha256:', fp)
          PYSIGN
          python3 "$KS_DIR/a2r_sign.py" "$KS_DIR"
          PW=$(printf '%s' "$A2R_SIGN_SECRET:a2r-home-store" | sha256sum | cut -c1-32)
          echo "::add-mask::$PW"
          openssl pkcs12 -export -inkey "$KS_DIR/key.pem" -in "$KS_DIR/cert.pem" -name a2r -passout "pass:$PW" \
            -keypbe AES-256-CBC -certpbe AES-256-CBC -macalg sha256 -out "$KS_DIR/a2r.p12"
          rm -f "$KS_DIR/key.pem" "$KS_DIR/a2r_sign.py"
          FP=$(openssl x509 -in "$KS_DIR/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)
          echo "A2R_KS=$KS_DIR/a2r.p12" >> "$GITHUB_ENV"
          echo "A2R_KS_PW=$PW" >> "$GITHUB_ENV"
          echo "A2R_CERT_FP=$FP" >> "$GITHUB_ENV"
          python3 - <<'PYGR'
          import glob, re
          f = glob.glob('android/app/build.gradle.kts')
          assert f, 'build.gradle.kts not found'
          f = f[0]
          s = open(f, encoding='utf-8').read()
          cfg = (
              '    signingConfigs {\n'
              '        create("a2r") {\n'
              '            storeFile = file(System.getenv("A2R_KS"))\n'
              '            storeType = "pkcs12"\n'
              '            storePassword = System.getenv("A2R_KS_PW")\n'
              '            keyAlias = "a2r"\n'
              '            keyPassword = System.getenv("A2R_KS_PW")\n'
              '            enableV1Signing = true\n'
              '            enableV2Signing = true\n'
              '        }\n'
              '    }\n\n')
          assert s.count('    buildTypes {') == 1, 'buildTypes block not found'
          s = s.replace('    buildTypes {', cfg + '    buildTypes {', 1)
          s, n = re.subn(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("a2r")', s)
          assert n == 1, 'release signingConfig line not found'
          open(f, 'w', encoding='utf-8').write(s)
          print(s)
          PYGR
          echo "### 🔏 التوقيع ثابت — بصمة الشهادة: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "(لازم البصمة دي تفضل هي هي في كل نسخة)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          rm -f analysis_options.yaml
          flutter pub get
          echo "--- JNI deps (لازم تكون فاضية) ---"
          flutter pub deps --style=compact | grep -i "jni" || echo "no jni"

      - name: Analyze (يوقف البناء لو في خطأ في الكود)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart

      - name: Build release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }} 2>&1 | tee /tmp/build.log; then
            # الأخطاء بتتلخص في Annotation علشان تتقرا من غير ما تفتح السجل كله
            MSG=$(grep -E '^e: |error:|What went wrong|Execution failed|FAILURE|AAPT|lint|Lint|Could not|Manifest merger' -A3 /tmp/build.log | head -45 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=build-summary::${MSG}"
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk A2R-Home.apk
          # v7: اتأكد من توقيع الـ APK الفعلي
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)apksigner
          if [ -x "$AS" ]; then
            GOT=$("$AS" verify --print-certs A2R-Home.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            echo "APK cert SHA-256: $GOT"
            WANT=$(echo "${A2R_CERT_FP:-}" | tr -d ':' | tr 'A-F' 'a-f')
            if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
              echo "::error title=التوقيع::الـ APK متوقع بمفتاح غير المتوقع ($GOT)"
              exit 1
            fi
            echo "- توقيع الـ APK: \`$GOT\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: A2R-Home-1.0.${{ github.run_number }}
          path: A2R-Home.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: A2R Home v1.0.${{ github.run_number }}
          files: A2R-Home.apk
